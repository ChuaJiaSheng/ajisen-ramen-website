      <hr />

      <img src="images/hire.jpg" alt="hire" />
      <form action="https://jkorpela.fi/cgi-bin/echo.cgi" method="post">
      <fieldset>
        <legend><h1>Apply Form</h1></legend>
        <div>
          <label>Name:</label>
          <input type="text" name="Name" required pattern="[a-zA-Z]{0-50}" title="Enter alphabet only" />
        </div>
        <div>
          <label>Email:</label>
          <input type="email" name="Email" required placeholder="myname@example.com" />
        </div>
        <div>
          <label>Phone Number:</label>
          <input type="tel" name="Phone Number" required />
        </div>
        <div>
          <label>Applied Position:</label>
          <select name="Position" required>
              <option value="Service Crew">Service Crew</option>
              <option value="Kitchen Crew">Kitchen Crew</option>
          </select>
        </div>
        <div>
          <label>Earliest Posible Start Date:</label>
          <input type="date" name="Start Date" required>
        </div>
        <div>
          <label>Expected End Date</label>
          <input type="date" name="End Date" required>
        </div>
        <div>
          <label>Preferred Interview Date:</label>
          <input type="datetime-local" name="Interview Date" required>
        </div>
        <div class="submit">
          <button type="submit">Submit</button>
          <button type="clear">Clear</button>
        </div>
      </fieldset>
      </form>

      <footer class="footerflex">
        <div class="delivery">

            <a href="order.html"><img src="images/logo.jpg" alt="Ajisen Ramen Logo"></a>
