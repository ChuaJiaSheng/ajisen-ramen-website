          <li>
            <a href="login.html" title="Login" id="login">Login / Register</a>
          </li>
        </ul>
      </nav>
      <hr />
      <header>
        <form action="https://jkorpela.fi/cgi-bin/echo.cgi" method="post">
          <div id="flex-container">
            <fieldset>
              <legend><h1>Register</h1></legend>
              <div>
                <label>Login ID:</label>
                <input name="Login" type="text" required />
              </div>
              <div>
                <label>Name:</label>
                <input
                  type="text"
                  name="Name"
                  required
                  pattern="[a -zA-Z]{0-50}"
                  title="Must not contain number"
                />
              </div>
              <div>
                <label>Password:</label>
                <input
                  type="password"
                  name="Password"
                  required
                  title="Password must be strong. Include at least 8 charaters including number, uppercse and/or special charaters"
                  pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                  minlength="8"
                />
              </div>
              <div>
                <label>Gender:</label>
                <input type="radio" name="gender" title="Must select one of the options" value="Male"/>Male
                <input type="radio" name="gender" title="Must select one of the options" value="Femal"/>Female
              </div>
              <div>
                <label>Mobile number:</label>
                <input type="tel" name="Mobile" required pattern="[8-9]{1}[0-9]{7}"/>
              </div>
              <div>
                <label>Race:</label>
                <select name="Race" required>
                  <option value="Chinese">Chinese</option>
                  <option value="Malay">Malay</option>
                  <option value="Indian">Indian</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div>
                <label>Personal Email Address:</label>
                <input type="email" name="Email" required />
              </div>
              <div>
                <label class="address">Address:</label>
                <textarea
                  name="Address"
                  id="address"
                  cols="30"
                  rows="10"
                  required
                ></textarea>
              </div>
              <div class="submit">
                <button type="submit">Register</button>
                <button type="reset">Clear</button>
              </div>
              <section>
                Have a account? <a href="login.html">Click here to login!!</a>
              </section>
            </fieldset>
          </div>
        </form>
      </header>
